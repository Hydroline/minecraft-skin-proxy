name: Deploy

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trigger:
    name: Sync and trigger CNB deployment
    runs-on: ubuntu-latest
    concurrency:
      group: cnb-main-sync
      cancel-in-progress: false
    env:
      CNB_REPOSITORY_SLUG: ${{ vars.CNB_REPOSITORY_SLUG }}
      CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
      CNB_API_TOKEN: ${{ secrets.CNB_API_TOKEN }}
      CNB_BRANCH: main
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Validate CNB configuration
        run: |
          for variable in CNB_REPOSITORY_SLUG CNB_TOKEN CNB_API_TOKEN; do
            test -n "${!variable}" || {
              echo "$variable GitHub Actions configuration is required." >&2
              exit 1
            }
          done

      - name: Sync source to CNB
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" \
            -w "$GITHUB_WORKSPACE" \
            -e "PLUGIN_TARGET_URL=https://cnb.cool/$CNB_REPOSITORY_SLUG.git" \
            -e 'PLUGIN_AUTH_TYPE=https' \
            -e 'PLUGIN_USERNAME=cnb' \
            -e "PLUGIN_PASSWORD=$CNB_TOKEN" \
            -e 'PLUGIN_BRANCH=main' \
            -e 'PLUGIN_GIT_USER=cnb' \
            -e 'PLUGIN_GIT_EMAIL=cnb@cnb.cool' \
            -e 'PLUGIN_FORCE=true' \
            tencentcom/git-sync

      - name: Trigger CNB pipeline
        run: |
          payload="$(jq -cn --arg event 'api_trigger_deploy' --arg branch "$CNB_BRANCH" '{ event: $event, branch: $branch }')"
          curl --fail-with-body --silent --show-error \
            --request POST \
            --url "https://api.cnb.cool/$CNB_REPOSITORY_SLUG/-/build/start" \
            --header "Authorization: $CNB_API_TOKEN" \
            --header 'Content-Type: application/json' \
            --data "$payload" | jq .
